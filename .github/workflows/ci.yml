name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only PyTorch: the default Linux build pulls several GB of CUDA libraries.
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The embedding and reranker models are about 4 GB. Cache them so only the
      # first run (or a run after the model names change) downloads them.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('querylens/retrieval/embedder.py', 'querylens/retrieval/reranker.py') }}

      - name: Run tests
        run: python -m pytest -q
